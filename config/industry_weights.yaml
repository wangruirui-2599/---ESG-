# ============================================================================
# ESG Insight Valuator (EIV) - 行业ESG权重配置
# ============================================================================
# 定义各行业的 E/S/G 三维度基础权重。
# 权重的经济学逻辑：
#   - 环境(E)：高污染/高能耗行业权重更高（如能源、化工、钢铁）
#   - 社会(S)：劳动密集型/消费类行业权重更高（如零售、医疗、教育）
#   - 治理(G)：金融/科技等监管敏感型行业权重更高（如银行、保险、互联网）
# 三维权重之和恒为1.0，由 DynamicWeightEngine 在此基础上叠加政策/舆情动态调整。

esg_weights:
  # --- 能源与资源 ---
  - industry: "石油石化"
    E_weight: 0.45
    S_weight: 0.25
    G_weight: 0.30

