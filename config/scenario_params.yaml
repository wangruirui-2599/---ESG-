# ============================================================================
# ESG Insight Valuator (EIV) - DCF多情景参数配置
# ============================================================================
# 定义乐观、中性、悲观三种情景下的估值假设参数。
# 使用场景：
#   - ScenarioValuator 加载此配置，对每只股票生成三情景DCF估值
#   - 各情景最终通过概率加权合并为期望估值
# 参数说明：
#   - revenue_growth:  未来5年营收复合增长率
#   - margin_change:   净利润率相对基准的变动（百分点）
#   - wacc:            加权平均资本成本（折现率）
#   - terminal_growth: 永续增长率（5年显式预测期后）
#   - esg_premium:     ESG因素对估值的溢价/折价调整（正值=溢价）
#   - probability:     情景发生的先验概率（三情景之和应为1.0）

scenarios:
  # ------------------------------------------------------------------
  # 乐观情景：经济复苏 + 政策利好 + ESG评级上调
  # ------------------------------------------------------------------
  - name: "乐观"
    revenue_growth: 0.15       # 15% 营收增长
    margin_change: 0.03        # 净利润率提升3个百分点
    wacc: 0.08                 # 8% 折现率（低风险偏好）
    terminal_growth: 0.035     # 3.5% 永续增长
    esg_premium: 0.10          # ESG正面溢价的10%
    probability: 0.25          # 25% 发生概率

  # ------------------------------------------------------------------
  # 中性情景：基准假设，经济平稳运行
  # ------------------------------------------------------------------
  - name: "中性"
    revenue_growth: 0.08       # 8% 营收增长
    margin_change: 0.00        # 净利润率不变
    wacc: 0.10                 # 10% 折现率（正常水平）
    terminal_growth: 0.025     # 2.5% 永续增长
    esg_premium: 0.00          # 无ESG溢价
    probability: 0.50          # 50% 发生概率

  # ------------------------------------------------------------------
  # 悲观情景：经济衰退 + 监管收紧 + ESG风险暴露
  # ------------------------------------------------------------------
  - name: "悲观"
    revenue_growth: 0.02       # 2% 营收增长
    margin_change: -0.05       # 净利润率下降5个百分点
    wacc: 0.12                 # 12% 折现率（高风险溢价）
    terminal_growth: 0.015     # 1.5% 永续增长
    esg_premium: -0.15         # ESG风险折价15%
    probability: 0.25          # 25% 发生概率
