# ============================================================================
# ESG Insight Valuator (EIV) - 行业关联与风险传导矩阵
# ============================================================================
# 定义行业间的上下游关联关系及风险传导系数。
# 传导逻辑：
#   - coefficient: 上游行业ESG风险对下游行业的传导强度 (0~1)
#   - 传导模型使用指数衰减: impact_target = risk_source * coefficient * exp(-distance)
#   - 系数基于投入产出表和历史相关性数据估算
# 在 ContagionAnalyzer 中加载并用于构建传导矩阵。

industry_linkages:
  # ==================== 能源 -> 下游 ====================
  - source: "石油石化"
    target: "基础化工"
    coefficient: 0.85

  - source: "石油石化"
    target: "交通运输"
    coefficient: 0.75

  - source: "石油石化"
    target: "汽车"
    coefficient: 0.40

